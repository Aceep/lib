services:
  kyle-lib:
    build: .
    image: kyle-lib
    restart: unless-stopped
    # Not published on the host: the only way in is through Caddy, over HTTPS.
    expose:
      - "3000"
    environment:
      # First admin, created only while no account exists. Remove ADMIN_PASSWORD from .env afterwards.
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Caddy is the only client: its X-Forwarded-* headers carry the real address and protocol.
      TRUST_PROXY: "true"
      # rclone source mirrored into /books; leave empty to index /books as is.
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      # Cron pattern for automatic syncs, "off" to disable (default: every day at 04:00).
      SYNC_CRON: ${SYNC_CRON:-0 4 * * *}
      # Daily copy of the database next to the library on the remote; "off" to disable.
      BACKUP_CRON: ${BACKUP_CRON:-30 4 * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      # Optional: summaries of books whose file has none are also looked up on Google Books.
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./data:/data
      - ./books:/books
      # rclone.conf created with `rclone config` on the host; read-only, the app never writes it.
      - ${RCLONE_CONFIG_DIR:-~/.config/rclone}:/config/rclone:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - kyle-lib
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and their private keys: keep this volume across updates.
      - caddy_data:/data

volumes:
  caddy_data:
